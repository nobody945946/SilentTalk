name: Verify Windows deployment contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deployment-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest ruff
      - run: python -m ruff check scripts/setup_copilot.py silenttalk/credentials.py tests/test_setup_copilot.py tests/test_credentials.py
      - run: python -m pytest -q tests/test_setup_copilot.py tests/test_edge_ai.py tests/test_credentials.py tests/test_config.py
      - name: Validate the PowerShell first-launch entry point
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/bootstrap.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
