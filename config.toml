[app]
speak_hotkey = "F8"
stop_hotkey = "F9"
max_text_length = 300

[tts]
engine = "edge"
voice = "zh-TW-YunJheNeural"
rate = "+0%"
pitch = "+0Hz"
volume = "+0%"
timeout_seconds = 20.0

[discord]
# Also read and answer in the voice channel's built-in text chat. Needs the
# Message Content Intent enabled for the bot in the Discord Developer Portal
# (Bot -> Privileged Gateway Intents); without it SilentTalk stays voice-only
# and says so in silenttalk.log.
text_chat = false
disconnect_when_owner_leaves = true
voice_reconnect_interval_seconds = 20.0
voice_reconnect_max_interval_seconds = 60.0
voice_state_settle_seconds = 1.5
owner_leave_grace_seconds = 8.0
voice_reconnect_cooldown_seconds = 2.0
voice_ready_timeout_seconds = 12.0

[audio]
ffmpeg_path = "ffmpeg"
playback_timeout_seconds = 90.0

[copilot]
enabled = true
endpoint_silence_ms = 650
llm_context_size = 4096
recent_turns = 16
max_session_turns = 100
context_char_budget = 2400
max_reply_chars = 72
llama_port = 18088
auto_popup = true
# Reply model in .runtime/models/llm/ (downloaded by the launcher). Gemma 4 E2B
# uses ~1.4 GB VRAM + ~2 GB RAM and keeps personas best for its size.
# Alternatives: "Qwen3.5-4B-Q4_K_M.gguf" (same quality, ~2.9 GB VRAM, slower)
# or "Qwen3-1.7B-Q4_K_M.gguf" (weaker personas, a bit faster on CPU only).
llm_model = "gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf"
# Layers offloaded to the GPU; 0 = CPU only (about 3x slower, still usable).
llm_gpu_layers = 99
# 8-bit KV cache + flash attention: 1.7B uses ~1.4 GB instead of ~1.6 GB (4B:
# ~2.8 GB instead of ~3.1 GB). Falls back to the normal cache automatically if
# the GPU driver can't do it.
llm_low_vram = true
# Character-mode LoRA adapter in .runtime/models/llm/ ("" = none). Only the
# character's own requests use it; Copilot suggestions stay on the plain model.
character_lora = ""
# When the character speaks up, decided line by line by the local model:
# "called" = only when someone calls it, asks it or answers it; "active" = it
# also joins in by itself when the topic suits it.
# Asked "are you an AI?": "in_character" keeps the act (an NPC does not
# announce it is scripted), "admit" owns up when sincerely asked.
character_ai_honesty = "in_character"
character_engagement = "called"
# Auto-compaction: once the session passes compact_keep_turns +
# compact_batch_turns, the older part is folded into a short summary by the
# local model, so long chats keep their thread at a fixed prompt size.
compact_context = true
compact_keep_turns = 20
compact_batch_turns = 12
# Speech-to-text engine: "paraformer" (default, streaming) or "sensevoice"
# (Silero VAD + offline SenseVoice: about the same accuracy -- 6.9% vs 7.2% CER
# on scripts/dev/stt_eval.py -- adds punctuation, uses less CPU, ~240 MB extra
# download). Re-run the launcher after changing it.
# stt_engine = "paraformer"
