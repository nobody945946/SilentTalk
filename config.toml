[app]
speak_hotkey = "F8"
stop_hotkey = "F9"
max_text_length = 300

[tts]
engine = "edge"
voice = "zh-TW-YunJheNeural"
rate = "+0%"
pitch = "+0Hz"
volume = "+0%"
timeout_seconds = 20.0

[discord]
disconnect_when_owner_leaves = true
voice_reconnect_interval_seconds = 60.0
voice_reconnect_max_interval_seconds = 300.0
voice_state_settle_seconds = 1.5
owner_leave_grace_seconds = 8.0
voice_reconnect_cooldown_seconds = 5.0

[audio]
ffmpeg_path = "ffmpeg"
playback_timeout_seconds = 90.0
