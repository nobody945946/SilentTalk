[app]
speak_hotkey = "F8"
stop_hotkey = "F9"
max_text_length = 300

[tts]
engine = "edge"
voice = "zh-TW-YunJheNeural"
rate = "+0%"
pitch = "+0Hz"
volume = "+0%"
timeout_seconds = 20.0

[discord]
# Also read and answer in the voice channel's built-in text chat. Needs the
# Message Content Intent enabled for the bot in the Discord Developer Portal
# (Bot -> Privileged Gateway Intents); without it SilentTalk stays voice-only
# and says so in silenttalk.log.
text_chat = false
disconnect_when_owner_leaves = true
voice_reconnect_interval_seconds = 20.0
voice_reconnect_max_interval_seconds = 60.0
voice_state_settle_seconds = 1.5
owner_leave_grace_seconds = 8.0
voice_reconnect_cooldown_seconds = 2.0
voice_ready_timeout_seconds = 12.0

[audio]
ffmpeg_path = "ffmpeg"
playback_timeout_seconds = 90.0

[copilot]
enabled = true
endpoint_silence_ms = 650
llm_context_size = 32768
max_session_turns = 240
max_reply_chars = 72
llama_port = 18088
auto_popup = true
# Reply model owned and loaded by the independent E4B Core. Gemma 4 E4B
# uses ~2.7 GB VRAM on a 3050 Ti (26.5 tokens/s) and beats E2B clearly: 60%
# vs 36% per line, options 60% vs 32%. "gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf" is
# the lighter choice (~1.4 GB VRAM, ~76 tokens/s; set character_lora to the
# E2B adapter with it). An adapter only fits the model it was trained on.
llm_model = "gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf"
# Layers offloaded to the GPU; 0 = CPU only (about 3x slower, still usable).
llm_gpu_layers = 99
# 8-bit KV cache + flash attention: 1.7B uses ~1.4 GB instead of ~1.6 GB (4B:
# ~2.8 GB instead of ~3.1 GB). Falls back to the normal cache automatically if
# the GPU driver can't do it.
llm_low_vram = true
# Character-mode LoRA adapter owned by E4B Core ("" = none), and which
# requests use it: "called" / "active"
# (the two "should I speak?" questions), "line" (what the character says),
# "options" (the W/A/S/D choices). v3 (E4B, trained only on rows an
# independent model checked) on called/active/line: stray replies 9.1% ->
# 0.5%, chiming in where it shouldn't 53% -> 7.5%, and its lines beat plain
# E4B 59% vs 40% (knowing the person 27 vs 15). With E2B use
# "character-e2b-lora-v1.q8_0.gguf" on "called" only.
character_lora = "character-e4b-lora-v3.q8_0.gguf"
character_lora_uses = "called,active,line"
# When the character speaks up, decided line by line by the local model:
# "called" = only when someone calls it, asks it or answers it; "active" = it
# also joins in by itself when the topic suits it.
# Asked "are you an AI?": "in_character" keeps the act (an NPC does not
# announce it is scripted), "admit" owns up when sincerely asked.
character_ai_honesty = "in_character"
character_engagement = "called"
# Character mode: after this many seconds of silence the character brings up
# something on its mind today or asks after someone (0 = never).
character_lull_seconds = 30
# Its own life between sessions (character_state.json, never the chat):
# "off" = new concerns every session; "light" = concerns, recent and mood are
# kept and move on after each chat; "full" = also views and feelings about
# each person, updated as it talks (for a bigger model than Gemma 4 E2B).
# Measured on Gemma 4 E2B (2026-09-28, 5 personas x 2-3 days): "light" lost
# to "off" on every count (life moves on 5 vs 13); the 2B model could not
# keep the state (nothing moved on, duplicates, its own nickname taken for
# someone else). Keep "off" on a 3050 Ti.
character_memory = "off"
# Auto-compaction: once the session passes compact_keep_turns +
# compact_batch_turns, the older part is folded into a short summary by the
# local model, so long chats keep their thread at a fixed prompt size.
compact_context = true
compact_keep_turns = 96
compact_batch_turns = 32
# Speech-to-text engine: "paraformer" (default, streaming) or "sensevoice"
# (Silero VAD + offline SenseVoice: about the same accuracy -- 6.9% vs 7.2% CER
# on scripts/dev/stt_eval.py -- adds punctuation, uses less CPU, ~240 MB extra
# download). Re-run the launcher after changing it.
# stt_engine = "paraformer"
